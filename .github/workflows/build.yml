name: Build USB Creator

# Assembles the stick payload from official upstream downloads plus the
# launcher/config files in payload/, then compiles Ai.Portable.USB.Creator.exe
# with the .NET Framework csc that ships with Windows. Replaces building from
# a hand-prepared source USB.
#
# Every download is checked against a pinned SHA256, except WezTerm: upstream
# only publishes a rolling "nightly" build, so its hash is read from the same
# release (catches corruption, not a compromised upstream).

on:
  push:
    branches: [main, 'improve/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENCODE_VERSION: '1.18.32'
  OPENCODE_SHA256: 'cd852831bd094c2df2eb379eb98bed7a63db7f823a7caf277c732cdac33cbdb6'
  NODE_VERSION: '24.21.0'
  RIPGREP_VERSION: '15.2.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $P  = Join-Path $env:RUNNER_TEMP 'payload'
          $dl = Join-Path $env:RUNNER_TEMP 'dl'
          New-Item -ItemType Directory -Force $dl | Out-Null

          function Get-File($url, $out, $sha256) {
            if (-not $sha256) { throw "No checksum for $url" }
            Invoke-WebRequest $url -OutFile $out
            $actual = (Get-FileHash $out -Algorithm SHA256).Hash
            if ($actual -ne $sha256.ToUpper()) { throw "Checksum mismatch for $url" }
          }
          # .sha256 files arrive as octet-stream and in varying formats (ripgrep's is
          # CertUtil output), so read as text and take the first 64-hex token
          function Get-Sha($url) {
            Invoke-WebRequest $url -OutFile "$dl/sum.txt"
            $m = [regex]::Match((Get-Content "$dl/sum.txt" -Raw), '\b[0-9a-fA-F]{64}\b')
            if (-not $m.Success) { throw "No SHA256 found in $url" }
            $m.Value
          }

          Copy-Item payload $P -Recurse
          Copy-Item docs/USB-README.txt (Join-Path $P 'README.txt')
          # git doesn't track empty dirs; the stick layout expects these
          foreach ($d in 'data/cache','data/config/agents','data/config/modes','data/config/plugins','data/logs','data/opencode','data/state') {
            New-Item -ItemType Directory -Force (Join-Path $P $d) | Out-Null
          }

          # OpenCode - baseline build has no AVX2 requirement, so it runs on older PCs
          Get-File "https://github.com/anomalyco/opencode/releases/download/v$env:OPENCODE_VERSION/opencode-windows-x64-baseline.zip" "$dl/oc.zip" $env:OPENCODE_SHA256
          Expand-Archive "$dl/oc.zip" "$dl/oc"
          Copy-Item (Get-ChildItem "$dl/oc" -Recurse -Filter opencode.exe | Select-Object -First 1).FullName "$P/bin/opencode.exe"

          # Node.js LTS (SHASUMS256.txt is served from nodejs.org alongside the zip)
          $node = "node-v$env:NODE_VERSION-win-x64"
          $sums = (Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/SHASUMS256.txt").Content
          $nodeSha = ($sums -split "`n" | Where-Object { $_ -match " $node\.zip$" }) -split '\s+' | Select-Object -First 1
          Get-File "https://nodejs.org/dist/v$env:NODE_VERSION/$node.zip" "$dl/node.zip" $nodeSha
          Expand-Archive "$dl/node.zip" $dl
          Move-Item "$dl/$node" "$P/nodejs"
          Rename-Item "$P/nodejs/install_tools.bat" 'install_tools.bat.DO_NOT_RUN'

          # ripgrep
          $rg = "ripgrep-$env:RIPGREP_VERSION-x86_64-pc-windows-msvc"
          $rgBase = "https://github.com/BurntSushi/ripgrep/releases/download/$env:RIPGREP_VERSION"
          Get-File "$rgBase/$rg.zip" "$dl/rg.zip" (Get-Sha "$rgBase/$rg.zip.sha256")
          Expand-Archive "$dl/rg.zip" $dl
          Copy-Item "$dl/$rg/rg.exe" "$P/bin/rg.exe"

          # WezTerm - upstream only publishes nightly builds now
          $wzBase = 'https://github.com/wezterm/wezterm/releases/download/nightly'
          Get-File "$wzBase/WezTerm-windows-nightly.zip" "$dl/wz.zip" (Get-Sha "$wzBase/WezTerm-windows-nightly.zip.sha256")
          Expand-Archive "$dl/wz.zip" "$dl/wz"
          $wzDir = (Get-ChildItem "$dl/wz" -Recurse -Filter wezterm-gui.exe | Select-Object -First 1).Directory.FullName
          Move-Item $wzDir "$P/wezterm"
          Get-ChildItem "$P/wezterm" -Recurse -Filter *.pdb | Remove-Item
          Write-Host "WezTerm nightly: $wzDir"

          & "$P/bin/opencode.exe" --version
          & "$P/nodejs/node.exe" --version
          "PAYLOAD=$P" | Out-File $env:GITHUB_ENV -Append

      - name: Compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./src/build-embedded.ps1 -SourcePath $env:PAYLOAD
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item src/create-usb.exe "dist/Ai.Portable.USB.Creator.$ver.exe"
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usb-creator
          path: dist/*
          compression-level: 0

  # Separate job so the write token never shares a runner with third-party downloads
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: usb-creator
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: "Updated components: OpenCode 1.18.32 (baseline build, runs on older CPUs), Node.js 24.21.0 LTS, ripgrep 15.2.0, WezTerm nightly. About 40 MB smaller: duplicate binaries and debug symbols removed. Built reproducibly on GitHub Actions; SHA256SUMS.txt attached."
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES"
